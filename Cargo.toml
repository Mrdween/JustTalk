[package]
name = "messenger"
version = "0.1.0"
edition = "2021"

[dependencies]
rusttype = { version = "0.9", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.29.0"["package"]
name = "my-app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7.3", features = ["runtime-tokio-native-tls", "postgres", "chrono"] }
dotenv = "0.15.0"

# Для работы с датой/временем (created_at)
chrono = { version = "0.4", features = ["serde"] }